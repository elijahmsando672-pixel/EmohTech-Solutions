# Auto-deploys the backend to Render whenever server/ changes on main.
# Enable by adding two repo secrets (Settings → Secrets → Actions):
#   RENDER_API_KEY  — Render API key (Account Settings → API Keys)
#   RENDER_SERVICE_ID — the Render web-service ID (from the service URL)
# See DEPLOYMENT.md for the full setup.

name: Deploy API to Render

on:
  push:
    branches: [main]
    paths:
      - "server/**"

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::Missing RENDER_API_KEY or RENDER_SERVICE_ID secrets — deploy skipped."
            exit 0
          fi
          curl -f -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json"